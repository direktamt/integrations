name: Image

# Publishes the container image of the API to the GitHub Container Registry
# once the CI workflow has passed for a push to master, and on demand from
# master. No secrets: the workflow token pushes the package.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One publication at a time, so that the moving tag ends on the newest run.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  publish:
    name: Build, smoke test and push the API image
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    # Native arm64 runner: the image is built for linux/arm64 without
    # emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/integrations-api
      # The commit CI has verified, not the head of the branch at start time.
      REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.REVISION }}

      - name: Derive the immutable tag
        id: tag
        run: echo "sha=sha-${REVISION::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          platforms: linux/arm64
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:master
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          docker run --detach --name api --publish 3000:3000 "$IMAGE:$TAG"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        run: docker push --all-tags "$IMAGE"
